apiVersion: apps/v1
kind: Deployment

metadata:
  name: deployment-tracker

spec:

  selector:
    matchLabels:
      app: deployment-tracker

  template:
    metadata:
      labels:
        app: deployment-tracker

    spec:
      containers:
        - name: deployment-tracker
          image: ryanarjoon123/deployment-tracker:35

          envFrom:
            - configMapRef:
                name: deployment-tracker-config
            - secretRef:
                name: deployment-tracker-secret

          ports:
            - containerPort: 8081

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"