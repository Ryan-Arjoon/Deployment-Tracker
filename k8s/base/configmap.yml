apiVersion: v1
kind: ConfigMap

metadata:
  name: deployment-tracker-config
  
data:
  SPRING_APPLICATION_NAME: "deployment-tracker"
  SPRING_DATASOURCE_URL: "jdbc:h2:file:./data/deploymentdb;DB_CLOSE_ON_EXIT=FALSE"
  SPRING_DATASOURCE_USERNAME: "sa"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_H2_CONSOLE_ENABLED: "true"
  SPRING_H2_CONSOLE_PATH: "/h2-console"
  SERVER_PORT: "8081"