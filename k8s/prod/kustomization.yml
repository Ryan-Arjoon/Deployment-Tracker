apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../base

images:
  - name: ryanarjoon123/deployment-tracker
    newTag: "tested-55"

patches:
  - target:
      version: v1
      kind: Service
      name: deployment-tracker-service
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30082


